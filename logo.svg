<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Шатровая деревянная церковь">
  <!-- Знак проекта: северная шатровая церковь. Цвет берётся из currentColor, чтобы знак подстраивался под фон. -->
  <g fill="currentColor">
    <!-- Крест -->
    <rect x="31" y="2" width="2" height="9"/>
    <rect x="28.5" y="4.5" width="7" height="1.8"/>
    <!-- Главка-луковица на барабане -->
    <path d="M32 9.5c-3 2.2-4.2 4.2-4.2 6.1 0 2 1.9 3.3 4.2 3.3s4.2-1.3 4.2-3.3c0-1.9-1.2-3.9-4.2-6.1z"/>
    <rect x="30.4" y="18.6" width="3.2" height="3"/>
    <!-- Шатёр -->
    <path d="M32 20.5 22.5 43h19z"/>
    <!-- Повал (свес над срубом) -->
    <path d="M19.5 43h25l-2 3.2h-21z"/>
    <!-- Сруб: венцы брёвен -->
    <rect x="22" y="46.8" width="20" height="2.6" rx="1.3"/>
    <rect x="22" y="50.2" width="20" height="2.6" rx="1.3"/>
    <rect x="22" y="53.6" width="20" height="2.6" rx="1.3"/>
    <rect x="22" y="57" width="20" height="2.6" rx="1.3"/>
    <!-- Прирубы по бокам с двускатными кровлями -->
    <path d="M10 50.5 16 46l6 4.5z"/>
    <rect x="11" y="51.2" width="10" height="2.4" rx="1.2"/>
    <rect x="11" y="54.3" width="10" height="2.4" rx="1.2"/>
    <rect x="11" y="57.4" width="10" height="2.4" rx="1.2"/>
    <path d="M42 50.5 48 46l6 4.5z"/>
    <rect x="43" y="51.2" width="10" height="2.4" rx="1.2"/>
    <rect x="43" y="54.3" width="10" height="2.4" rx="1.2"/>
    <rect x="43" y="57.4" width="10" height="2.4" rx="1.2"/>
    <!-- Земля -->
    <rect x="6" y="60.6" width="52" height="1.6" rx="0.8"/>
  </g>
</svg>
