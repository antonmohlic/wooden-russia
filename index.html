<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Карта объектов — Лемех</title>
  <meta name="description" content="Карта памятников деревянного зодчества России">
  <!-- Превью ссылки в Telegram, ВКонтакте и других соцсетях -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Лемех">
  <meta property="og:locale" content="ru_RU">
  <meta property="og:title" content="Лемех — открытый каталог деревянного зодчества России">
  <meta property="og:description" content="Карта памятников деревянного зодчества России">
  <meta property="og:url" content="https://lemekh.ru/">
  <meta property="og:image" content="https://commons.wikimedia.org/wiki/Special:FilePath/Kishi_church_2.jpg?width=1200">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Библиотека карт Leaflet 1.9.4 — лежит на нашем сервере, чтобы не зависеть от зарубежных CDN -->
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <script src="vendor/leaflet/leaflet.js"></script>
  <!-- Группировка близких меток (Leaflet.markercluster 1.5.3) -->
  <link rel="stylesheet" href="vendor/markercluster/MarkerCluster.css">
  <script src="vendor/markercluster/leaflet.markercluster.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body class="page-map">
  <div class="map-layout">
    <main id="map"></main>

    <!-- Кнопка открывает панель фильтров поверх карты -->
    <button class="filters-toggle" id="panel-toggle" type="button" aria-controls="map-panel" aria-expanded="false">
      Фильтры <span class="filters-badge" id="filters-badge" hidden></span>
    </button>
    <p class="map-count" id="count">Загрузка…</p>

    <aside class="map-panel" id="map-panel" hidden>
      <div class="panel-header">
        <h2 class="panel-title">Фильтры</h2>
        <button class="panel-close" id="panel-close" type="button" aria-label="Скрыть фильтры">✕</button>
      </div>
      <div class="filters filters--column" id="filters"></div>
      <button class="button panel-done" id="panel-done" type="button">Показать на карте</button>
    </aside>

    <div class="legend">
      <div><span class="dot" style="background:#2e7d32"></span>сохранился</div>
      <div><span class="dot" style="background:#b45f00"></span>аварийный</div>
      <div><span class="dot" style="background:#6b6b6b"></span>утрачен</div>
      <div><span class="dot dot--museum"></span>музей (цифра — число памятников)</div>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="common.js"></script>
  <script src="map.js"></script>
</body>
</html>
